<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Registro</h1>
        <form id="formRegistro">
            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
                <span class="mensaje-error" id="errorNombre"></span>
            </div>
            <div class="campo">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" required>
                <span class="mensaje-error" id="errorApellido"></span>
            </div>
            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <span class="mensaje-error" id="errorEmail"></span>
            </div>
            <div class="campo">
                <label for="direccion">Direccion:</label>
                <input type="direccion" id="direccion" required>
                <span class="mensaje-error" id="errorDireccion"></span>
            </div>
            <div class="campo">
                <label for="telefono">Telefono:</label>
                <input type="telefono" id="telefono" required>
                <span class="mensaje-error" id="errorTelefono"></span>
            </div>
            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
                <span class="mensaje-error" id="errorPassword"></span>
            </div>
            <div class="campo">
                <label for="confirmar">Confirmar Contraseña:</label>
                <input type="password" id="confirmar" required>
                <span class="mensaje-error" id="errorConfirmar"></span>
            </div>
            <button type="button" id="btnRegistrar">Registrarse</button>
            <button type="button" id="btnLimpiar">Limpiar</button>
        </form>
        <div id="datosUsuario"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
